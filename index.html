
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CS Career Simulator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
    <style>
      :root {
        --color-base-bg: #F9FAFB;
        --color-card-bg: #FFFFFF;
        --color-accent: #7C3AED;
        --color-primary-text: #1F2937;
        --color-secondary-text: #6B7280;
        --color-success: #059669;
        --color-error: #DC2626;
        --color-warning: #D97706;
        --gradient-start: rgba(124, 58, 237, 0.05);
        --gradient-end: rgba(124, 58, 237, 0.08);
      }
      .dark {
        --color-base-bg: #1A1B26;
        --color-card-bg: #2A2D3E;
        --color-accent: #A78BFA;
        --color-primary-text: #F3F4F6;
        --color-secondary-text: #9CA3AF;
        --color-success: #34D399;
        --color-error: #F87171;
        --color-warning: #FBBF24;
        --gradient-start: rgba(167, 139, 250, 0.07);
        --gradient-end: rgba(167, 139, 250, 0.1);
      }
      
      /* Gamified Mode Styles */
      .gamified {
        --color-base-bg: #0f0e17;
        --color-card-bg: #232946;
        --color-accent: #ff8906;
        --color-primary-text: #fffffe;
        --color-secondary-text: #a7a9be;
        --color-success: #3da9fc;
        --color-error: #ef4565;
        --color-warning: #ffd803;
      }

      .gamified body {
          font-family: 'VT323', monospace;
          font-size: 1.2rem;
          background-color: var(--color-base-bg);
          background-image: 
              linear-gradient(rgba(255, 255, 255, 0.03) 2px, transparent 2px),
              linear-gradient(90deg, rgba(255, 255, 255, 0.03) 2px, transparent 2px);
          background-size: 40px 40px;
      }

      .gamified h1, .gamified h2, .gamified h3, .gamified h4, .gamified .font-bold {
          font-family: 'Press Start 2P', cursive;
          font-weight: normal; 
          text-transform: uppercase;
          letter-spacing: 1px;
      }
      
      /* Adjust heading sizes for the pixel font (it's large) */
      .gamified h1 { font-size: 1.5rem !important; line-height: 2.2rem !important; color: var(--color-accent); text-shadow: 3px 3px 0px #000; }
      .gamified h2 { font-size: 1.1rem !important; line-height: 1.8rem !important; }
      .gamified h3 { font-size: 0.9rem !important; line-height: 1.5rem !important; }
      
      /* Remove rounded corners for retro look */
      .gamified .rounded-lg, 
      .gamified .rounded-xl, 
      .gamified .rounded-2xl, 
      .gamified .rounded-full {
          border-radius: 0px !important;
      }
      
      /* Add thick borders and hard shadows */
      .gamified button, 
      .gamified input, 
      .gamified textarea,
      .gamified .group {
          border: 2px solid var(--color-primary-text); 
          box-shadow: 4px 4px 0px 0px #000;
      }

      .gamified .bg-card-bg\/30 {
          background-color: var(--color-card-bg) !important;
          opacity: 1;
          border: 4px solid var(--color-primary-text);
          box-shadow: 8px 8px 0px 0px #000;
      }
      
      /* Button Interactions in Gamified Mode */
      .gamified button:hover {
          transform: translate(-2px, -2px);
          box-shadow: 6px 6px 0px 0px var(--color-accent);
          border-color: var(--color-accent);
      }
      
      .gamified button:active {
          transform: translate(4px, 4px);
          box-shadow: 0px 0px 0px 0px #000;
      }

      body {
          background-color: var(--color-base-bg);
          background-image: radial-gradient(circle at top left, var(--gradient-start), transparent 40%), radial-gradient(circle at bottom right, var(--gradient-end), transparent 50%);
          transition: background-color 0.3s ease, color 0.3s ease;
      }
    </style>
    <script>
      // Immediately invoked function to set theme on initial load
      (function() {
        const isGamified = localStorage.getItem('gamified') === 'true';
        if (isGamified) {
            document.documentElement.classList.add('gamified');
        }

        if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      })();
    </script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        'base-bg': 'var(--color-base-bg)',
                        'card-bg': 'var(--color-card-bg)',
                        'accent': 'var(--color-accent)',
                        'primary-text': 'var(--color-primary-text)',
                        'secondary-text': 'var(--color-secondary-text)',
                        'success': 'var(--color-success)',
                        'error': 'var(--color-error)',
                        'warning': 'var(--color-warning)',
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    borderRadius: {
                        'lg': '8px',
                        '2xl': '1rem',
                    },
                    backdropBlur: {
                        sm: '4px',
                    }
                }
            }
        }
    </script>
<script type="importmap">
{
  "imports": {
    "react": "https://aistudiocdn.com/react@^19.2.0",

  }
}
</script>
</head>
<body class="font-sans bg-cover bg-center">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
</body>
</html>
